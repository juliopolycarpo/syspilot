[package]
name = "syspilot-svc"
description = "SysPilot service and command-line interface."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Lets the service accept fan curves and keep a worker running for them. Off
# until fan control has been validated on real hardware for at least one
# catalogued board. The registers are written by the worker, which has its own
# feature of the same name (`syspilot-sensors/fan-control`); a build that
# follows curves needs both. Releases have neither.
fan-control = ["syspilot-hw/fan-control"]

# The resident process is budgeted: adding a dependency here needs an entry
# in docs/decisions.md with its size impact.
[dependencies]
syspilot-proto.workspace = true
syspilot-engine.workspace = true
syspilot-hw.workspace = true
syspilot-pawnio.workspace = true
serde.workspace = true
toml.workspace = true
postcard.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
# Tests put the processes they start in a job that ends them with the test,
# starting them suspended and resuming their threads once they are in it.
windows-sys = { workspace = true, features = [
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
] }
