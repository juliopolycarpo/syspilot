[package]
name = "syspilot-hw"
description = "SysPilot hardware layer: sensor providers, Super I/O support and the fan-curve engine."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[features]
# Reading the DDR4 SPD contents beyond page 0 (module manufacturer and part
# number) and making sure the bus is on page 0 before the scan needs the one
# SMBus write SysPilot has: a write to the page-select device at 0x36 or
# 0x37. No temperature read needs it (the JC-42.4 sensors at 0x18-0x1F and the
# SPD5118 hub registers are not paged), and decision 12 says version 1 never
# writes to hardware, so the default build has no SMBus write at all: the
# write method does not exist on the `Smbus` trait. Off in release builds.
spd-paging = []

[dependencies]
syspilot-pawnio.workspace = true
syspilot-proto.workspace = true
serde.workspace = true
toml.workspace = true
windows-sys = { workspace = true, features = [
    "Wdk_Graphics_Direct3D",
    "Wdk_System_SystemInformation",
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Kernel",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }

[dev-dependencies]
# The sensors example reports the process's private memory after each probe.
windows-sys = { workspace = true, features = ["Win32_System_ProcessStatus"] }
