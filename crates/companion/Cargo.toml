[package]
name = "syspilot-companion"
description = "SysPilot update companion: shows an update the app started and opens the app again when it is done."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "syspilot-companion"
path = "src/main.rs"

[dependencies]
syspilot-proto.workspace = true
# No toolkit: the companion runs while Windows Installer replaces the app's
# toolkit runtime, so it must not load any of it. Its window is plain Win32
# drawn with Direct2D and DirectWrite, which are part of Windows, with the
# Windows task dialog in reserve.
windows = { version = "0.62", features = [
    "Foundation",
    "UI",
    "UI_ViewManagement",
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# The UI Automation providers' COM objects, made with its `implement` macro.
windows-core = "0.62"
# Points and sizes in the Direct2D calls above.
windows-numerics = "0.3"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Reading the built executable's version resource.
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3"
