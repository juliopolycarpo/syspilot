[package]
name = "syspilot-companion"
description = "SysPilot update companion: shows an update the app started and opens the app again when it is done."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "syspilot-companion"
path = "src/main.rs"

[dependencies]
syspilot-proto.workspace = true
# Plain Win32 and the Windows task dialog, no toolkit: the companion runs
# while Windows Installer replaces the app's toolkit runtime, so it must
# not load any of it.
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
