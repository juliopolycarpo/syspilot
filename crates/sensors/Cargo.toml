[package]
name = "syspilot-sensors"
description = "SysPilot sensor worker: reads the hardware on behalf of the service."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "syspilot-sensors"
path = "src/main.rs"

[features]
# Lets the worker write to the fan controller of a validated board. Off by
# default and never in a release; see docs/research/fan-control.md.
fan-control = ["syspilot-hw/fan-control"]

[dependencies]
syspilot-proto.workspace = true
syspilot-hw.workspace = true
syspilot-pawnio.workspace = true
