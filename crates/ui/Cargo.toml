[package]
name = "syspilot-ui"
description = "SysPilot desktop app."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "syspilot"
path = "src/main.rs"

[dependencies]
syspilot-proto.workspace = true
windows-reactor = "0.100"

[build-dependencies]
# Stages the Windows App SDK runtime next to the executable, so the app
# needs nothing installed.
windows-reactor-setup = "0.100"
