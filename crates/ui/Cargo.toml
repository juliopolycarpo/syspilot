[package]
name = "syspilot-ui"
description = "SysPilot desktop app."
license = "GPL-3.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[[bin]]
name = "syspilot"
path = "src/main.rs"

[dependencies]
syspilot-proto.workspace = true
serde.workspace = true
toml.workspace = true
# Pinned: the toolkit is a preview and its API changes between releases.
windows-reactor = "=0.100.0"
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"
# Stages the Windows App SDK runtime next to the executable, so the app
# needs nothing installed.
windows-reactor-setup = "0.100"
