name: Release

# A tag such as v0.2.0 builds the installer and publishes it as a draft
# release. The draft is not offered to anyone: a maintainer signs the package
# with the release key, which is not in this repository or its secrets, and
# publishes it (scripts/sign-release.ps1 -Tag v0.2.0 -Publish).
#
# Only vX.Y.Z tags: SysPilot has no pre-releases, and cliff.toml's tag_pattern
# would not see a tag such as v0.4.0-rc.1, so its changelog check could never
# pass. Widen both together if that changes.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  # (dry run, not for merging): exercise every step but the tag-only ones.
  pull_request:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: Build and publish the package
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      # The whole history and its tags: git-cliff reads them to write the
      # changelog.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install the toolchain
        run: rustup show active-toolchain

      - uses: Swatinem/rust-cache@v2

      - name: Check that the tag is the workspace version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages |
            Where-Object name -eq 'syspilot-svc' | Select-Object -ExpandProperty version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "(tag): expected v$version, the version in Cargo.toml | received: $env:GITHUB_REF_NAME"
          }

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      # The release PR writes CHANGELOG.md with `git cliff --tag`, which dates
      # the new release on the day it ran. Here the release is dated by its
      # squash commit, which may be a later day, so the newest release's date
      # is left out of the comparison. Anything else that differs means the
      # file is stale.
      - name: Check that CHANGELOG.md is up to date
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          git cliff --output $env:RUNNER_TEMP/CHANGELOG.md
          if ($LASTEXITCODE -ne 0) { throw "(git cliff): expected exit code 0 | received: $LASTEXITCODE" }
          $newestDate = [regex] '(?m)^(## \[.+\]\(.+\)) - \d{4}-\d{2}-\d{2}$'
          $expected = $newestDate.Replace((Get-Content -Raw $env:RUNNER_TEMP/CHANGELOG.md), '$1', 1)
          $committed = $newestDate.Replace((Get-Content -Raw CHANGELOG.md), '$1', 1)
          # -cne: PowerShell's -ne ignores case, which would pass a stale file.
          if ($committed -cne $expected) {
            git diff --no-index CHANGELOG.md $env:RUNNER_TEMP/CHANGELOG.md
            throw "(CHANGELOG.md): expected the output of git cliff at $env:GITHUB_REF_NAME | received: a different file. Delete the tag, regenerate the file in a release PR (git cliff --tag $env:GITHUB_REF_NAME -o CHANGELOG.md) and tag again."
          }

      # The newest release of the changelog, as the draft's notes for the
      # maintainer to edit before publishing.
      - name: Write the release notes
        shell: pwsh
        run: |
          git cliff --latest --strip all --output $env:RUNNER_TEMP/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "(git cliff): expected exit code 0 | received: $LASTEXITCODE" }

      # The version .config/nextest.toml requires.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.152

      - name: Test
        run: cargo nextest run --workspace --locked --profile ci

      # As in CI: nextest has no doctests, and a step of their own keeps a
      # test failure from being hidden by their exit code.
      - name: Doctests
        run: cargo test --doc --workspace --locked

      # The modules are the PawnIO project's signed LGPL files, pinned by
      # SHA-256. They go into the package as separate files with their
      # licence text.
      - name: Fetch the PawnIO modules
        run: cargo xtask fetch-modules

      # Builds the workspace and the installer. The script installs the
      # pinned WiX toolset with the .NET SDK of the runner.
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      # The same package, as a test instance: installed, checked and removed
      # on the runner, which must leave nothing behind.
      - name: Install and remove the package
        id: package
        shell: pwsh
        run: ./scripts/test-package.ps1

      # As in CI: Windows Installer's logs of each step, when one failed.
      - name: Keep the package test's logs
        if: failure() && steps.package.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: package-test-logs-${{ github.ref_name }}
          path: target/package-test
          retention-days: 14

      - name: Publish a draft release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The product's package and checksum only: dist also holds the
          # test packages of the step above. The signature is added by the
          # maintainer.
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $files = "dist/SysPilot-$version-x64.msi", "dist/SysPilot-$version-x64.msi.sha256"
          foreach ($file in $files) {
            if (-not (Test-Path $file)) {
              throw "(release files): expected $file | received: no such file"
            }
          }
          gh release create $env:GITHUB_REF_NAME @files --draft --verify-tag --notes-file $env:RUNNER_TEMP/release-notes.md --title "SysPilot $($env:GITHUB_REF_NAME.TrimStart('v'))"
