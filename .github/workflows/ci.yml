name: CI

# Temporary: runs test-package.ps1 with a failure injected while the app is
# open, then checks that its cleanup left nothing. Not for merging.
on:
  pull_request:

permissions:
  contents: read

jobs:
  cleanup:
    name: Package test cleanup after a failure
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --workspace --locked
      - name: Run the package test, which must fail
        id: package
        continue-on-error: true
        shell: pwsh
        run: ./scripts/test-package.ps1
      - name: Check that the failure was the injected one and nothing is left
        shell: pwsh
        run: |
          if ('${{ steps.package.outcome }}' -ne 'failure') { throw "(package test): expected failure | received: ${{ steps.package.outcome }}" }
          $instance = 'SysPilot-Test.msi'
          $left = @{
            'service' = [bool](Get-Service $instance -ErrorAction SilentlyContinue)
            'service key' = Test-Path "HKLM:\SYSTEM\CurrentControlSet\Services\$instance"
            'event log source' = Test-Path "HKLM:\SYSTEM\CurrentControlSet\Services\EventLog\Application\$instance"
            'install folder' = Test-Path (Join-Path $env:ProgramFiles $instance)
            'data folder' = Test-Path (Join-Path $env:ProgramData $instance)
            'preferences' = Test-Path (Join-Path $env:LOCALAPPDATA $instance)
            'shortcut' = Test-Path (Join-Path $env:ProgramData "Microsoft\Windows\Start Menu\Programs\$instance.lnk")
            'scratch key' = Test-Path 'HKLM:\SOFTWARE\SysPilot-Test\Msi'
            'processes' = [bool](Get-Process | Where-Object { $_.Path -like "$env:ProgramFiles\$instance\*" })
            'Installed apps entry' = [bool](Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object DisplayName -eq $instance)
          }
          $left.GetEnumerator() | Sort-Object Name | ForEach-Object { '{0,-22} {1}' -f $_.Name, $(if ($_.Value) { 'LEFT' } else { 'gone' }) }
          $dirty = @($left.GetEnumerator() | Where-Object Value | ForEach-Object Name)
          if ($dirty) { throw "(cleanup after a failure): expected nothing left | received: $($dirty -join ', ')" }
