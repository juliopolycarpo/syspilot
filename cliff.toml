# git-cliff turns the Conventional Commit subjects on main into CHANGELOG.md.
# The release PR regenerates the file (see CONTRIBUTING.md), and the release
# workflow refuses a tag whose CHANGELOG.md is not what this file produces.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Every change to SysPilot, by release. This file is generated from the commit
messages by [git-cliff](https://git-cliff.org); do not edit it by hand.

"""
# One section per release. A release links to its diff against the previous
# one; the first release links to its tag.
body = """
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](<REPO>/compare/{{ previous.version }}...{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}](<REPO>/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## Unreleased
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim }}
    {% for commit in entry.commits %}
        - {% if commit.breaking %}**Breaking:** {% endif %}\
            {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
            {% if commit.group is containing("Reverted") %}{{ commit.message }}\
            {% else %}{{ commit.message | upper_first }}{% endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
render_always = true
postprocessors = [
    { pattern = '<REPO>', replace = "https://github.com/juliopolycarpo/syspilot" },
]

[git]
conventional_commits = true
# A commit on main that is not a Conventional Commit fails the run instead of
# going missing from the changelog.
require_conventional = true
split_commits = false
commit_preprocessors = [
    # A squash-merged PR ends its subject with "(#38)": link it. The subject is
    # the first line of the message, hence the multi-line flag.
    { pattern = '(?m)\(#([0-9]+)\)$', replace = "([#${1}](<REPO>/pull/${1}))" },
]
protect_breaking_commits = true
# The HTML comments only order the groups; striptags removes them.
commit_parsers = [
    { message = "^chore: release ", skip = true },
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^revert", group = "<!-- 3 -->Reverted" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^refactor", group = "<!-- 5 -->Refactoring" },
    { message = "^test", group = "<!-- 6 -->Tests" },
    { message = "^(build|ci)", group = "<!-- 7 -->Build and CI" },
    { message = "^(chore|style)", group = "<!-- 8 -->Chores" },
    # Keeps every commit in play, so that require_conventional sees it.
    { message = ".*", group = "<!-- 9 -->Other" },
]
# Matches the tags that start the release workflow (release.yml).
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
topo_order = false
topo_order_commits = true
sort_commits = "oldest"
