# Reliability: stability, recoverability and update behavior.
# Rules for every entry are in docs/tweak-catalog.md.

[[tweak]]
id = "reliability.fast-startup"
title = "Turn off fast startup"
summary = "Shut down fully shuts Windows down, so the next start loads everything fresh."
detail = '''Sets HKLM\SYSTEM\CurrentControlSet\Control\Session Manager\Power\HiberbootEnabled (REG_DWORD) to 0 (0 = disabled, 1 = enabled). Microsoft documents this value as the way to disable fast startup.'''
level = "advanced"
category = "reliability"
side-effects = "Starting the PC after Shut down takes longer."
source = "https://learn.microsoft.com/windows/configuration/unified-write-filter/hibernate-once-resume-many-horm"

[[tweak.action]]
registry = { scope = "machine", key = 'SYSTEM\CurrentControlSet\Control\Session Manager\Power', name = "HiberbootEnabled", data = { dword = 0 } }

[[tweak]]
id = "reliability.crash-dump-automatic"
title = "Write an automatic memory dump on a crash"
summary = "After a system crash, Windows saves an automatic memory dump that you can use to find the cause."
detail = '''Sets HKLM\System\CurrentControlSet\Control\CrashControl\CrashDumpEnabled (REG_DWORD) to 0x7 (automatic memory dump). Other documented values: 0x0 none, 0x1 complete memory dump, 0x2 kernel memory dump, 0x3 small memory dump (64 KB).'''
level = "advanced"
category = "reliability"
side-effects = "A dump file is written to disk after every crash."
reboot = "restart"
source = "https://support.microsoft.com/help/254649"

[[tweak.action]]
registry = { scope = "machine", key = 'System\CurrentControlSet\Control\CrashControl', name = "CrashDumpEnabled", data = { dword = 7 } }

[[tweak]]
id = "reliability.long-paths"
title = "Allow file paths longer than 260 characters"
summary = "Apps that support it can open files whose full path is longer than 260 characters."
detail = '''Policy: Computer Configuration > Administrative Templates > System > Filesystem > Enable Win32 long paths. Sets HKLM\SYSTEM\CurrentControlSet\Control\FileSystem\LongPathsEnabled (REG_DWORD) to 1. Only applications whose manifest declares them long path aware are affected. The system caches the value per process on the first affected file call, so a restart may be needed for every app to see it.'''
level = "advanced"
category = "reliability"
reboot = "restart"
source = "https://learn.microsoft.com/windows/win32/fileio/maximum-file-path-limitation"

[[tweak.action]]
registry = { scope = "machine", key = 'SYSTEM\CurrentControlSet\Control\FileSystem', name = "LongPathsEnabled", data = { dword = 1 } }

[[tweak]]
id = "reliability.update-no-auto-restart"
title = "Do not restart automatically while someone is signed in"
summary = "Windows Update does not restart the PC by itself while a user is signed in."
detail = '''Sets HKLM\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU\NoAutoRebootWithLoggedOnUsers (REG_DWORD) to 1. With the value at 1, Automatic Updates does not automatically restart a computer while users are logged on. Microsoft notes that this older policy does not work exactly as described and can mean quality updates are never finished on a PC whose user rarely signs out; active hours are the usual way to keep restarts out of working time.'''
level = "advanced"
category = "reliability"
direction = "weakens"
risk = "Security updates can wait for a restart indefinitely, so known flaws stay open on a PC that is rarely signed out of."
side-effects = "Updates stay unfinished until someone restarts the PC, which delays the fixes they contain."
source = "https://learn.microsoft.com/windows/deployment/update/waas-wu-settings"

[[tweak.action]]
registry = { scope = "machine", key = 'SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU', name = "NoAutoRebootWithLoggedOnUsers", data = { dword = 1 } }

[[tweak]]
id = "reliability.update-exclude-drivers"
title = "Exclude drivers from Windows Update"
summary = "Windows Update stops installing driver updates together with quality updates, so a bad driver update cannot arrive unannounced."
detail = '''Policy: Computer Configuration > Administrative Templates > Windows Components > Windows Update > Manage updates offered from Windows Update > Do not include drivers with Windows Updates. Sets HKLM\Software\Policies\Microsoft\Windows\WindowsUpdate\ExcludeWUDriversInQualityUpdate (REG_DWORD) to 1 (exclude Windows Update drivers). Applies to Windows 10 1607 and later and Windows 11.'''
level = "advanced"
category = "reliability"
side-effects = "You have to install driver updates yourself, including security fixes in drivers, from the PC maker or the device maker."
source = "https://learn.microsoft.com/windows/client-management/mdm/policy-csp-update#excludewudriversinqualityupdate"

[[tweak.action]]
registry = { scope = "machine", key = 'Software\Policies\Microsoft\Windows\WindowsUpdate', name = "ExcludeWUDriversInQualityUpdate", data = { dword = 1 } }

[[tweak]]
id = "reliability.storage-sense"
title = "Turn on Storage Sense"
summary = "Windows frees disk space on its own when the disk runs low on free space."
detail = '''Policy: Computer Configuration > Administrative Templates > System > Storage Sense > Allow Storage Sense, enabled. Sets HKLM\Software\Policies\Microsoft\Windows\StorageSense\AllowStorageSenseGlobal (REG_DWORD) to 1 (allow). Storage Sense is then on with the default cadence "during low free disk space", and users can change the cadence but cannot turn it off. Applies to Windows 10 1903 and later and Windows 11.'''
level = "advanced"
category = "reliability"
side-effects = "Storage Sense can clean up some of the user's files to free disk space, and users cannot turn it off while the policy is set."
source = "https://learn.microsoft.com/windows/client-management/mdm/policy-csp-storage#allowstoragesenseglobal"

[[tweak.action]]
registry = { scope = "machine", key = 'Software\Policies\Microsoft\Windows\StorageSense', name = "AllowStorageSenseGlobal", data = { dword = 1 } }

[[tweak]]
id = "reliability.crash-no-auto-restart"
title = "Do not restart automatically after a system crash"
summary = "After a system crash, Windows stays on the error screen so you can read the stop code instead of restarting at once."
detail = '''Sets HKLM\System\CurrentControlSet\Control\CrashControl\AutoReboot (REG_DWORD) to 0. Microsoft documents this value as the "Automatically restart" option under Startup and Recovery: it is on by default and is turned off by setting AutoReboot to 0. The memory dump is still written as set by CrashDumpEnabled.'''
level = "advanced"
category = "reliability"
side-effects = "A PC that nobody watches stays stopped after a crash until someone restarts it by hand."
reboot = "restart"
source = "https://learn.microsoft.com/troubleshoot/windows-client/performance/configure-system-failure-and-recovery-options"

[[tweak.action]]
registry = { scope = "machine", key = 'System\CurrentControlSet\Control\CrashControl', name = "AutoReboot", data = { dword = 0 } }

[[tweak]]
id = "reliability.keyboard-crash"
title = "Allow forcing a crash from the keyboard"
summary = "Holding the right Ctrl key and pressing Scroll Lock twice crashes the PC on purpose, so you can capture a dump of a frozen system."
detail = '''Sets CrashOnCtrlScroll (REG_DWORD) to 1 under HKLM\System\CurrentControlSet\Services\i8042prt\Parameters (PS/2 keyboards) and HKLM\System\CurrentControlSet\Services\kbdhid\Parameters (USB keyboards). After a restart, holding the rightmost Ctrl key and pressing Scroll Lock twice makes Windows raise bug check 0xE2 (MANUALLY_INITIATED_CRASH) and write a crash dump unless crash dumps are turned off. Microsoft warns that the crash stops the system immediately and might lose data. The matching value for Hyper-V keyboards (hyperkbd\Parameters) is not set here.'''
level = "advanced"
category = "reliability"
direction = "weakens"
risk = "Anyone at the keyboard can crash this PC on purpose, and a key press by mistake stops it at once and loses unsaved work."
side-effects = "A crash dump is written only if crash dumps are turned on."
reboot = "restart"
source = "https://learn.microsoft.com/windows-hardware/drivers/debugger/forcing-a-system-crash-from-the-keyboard"

[[tweak.action]]
registry = { scope = "machine", key = 'System\CurrentControlSet\Services\i8042prt\Parameters', name = "CrashOnCtrlScroll", data = { dword = 1 } }

[[tweak.action]]
registry = { scope = "machine", key = 'System\CurrentControlSet\Services\kbdhid\Parameters', name = "CrashOnCtrlScroll", data = { dword = 1 } }

[[tweak]]
id = "reliability.user-mode-crash-dumps"
title = "Save a full memory dump when an app crashes"
summary = "When a program crashes, Windows saves a full memory dump of it that a developer can open in a debugger."
detail = '''Sets HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps\DumpType (REG_DWORD) to 2 (0 = custom dump, 1 = mini dump, 2 = full dump). Microsoft documents local dump collection as off by default and configured by the values under the LocalDumps key. Dumps go to %LOCALAPPDATA%\CrashDumps (DumpFolder default) and Windows keeps the newest 10 (DumpCount default). The feature works even when error reporting is off. It does not collect a dump for apps that do their own crash reporting or have automatic debugging set.'''
level = "advanced"
category = "reliability"
side-effects = "Each crash writes a file as large as the app's memory, which can hold passwords and other private data the app had open."
source = "https://learn.microsoft.com/windows/win32/wer/collecting-user-mode-dumps"

[[tweak.action]]
registry = { scope = "machine", key = 'SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps', name = "DumpType", data = { dword = 2 } }

[[tweak]]
id = "reliability.disk-failure-prediction"
title = "Keep disk failure prediction up to date"
summary = "Windows keeps downloading updates to the model it uses to predict that a storage disk is about to fail."
detail = '''Policy: Computer Configuration > Administrative Templates > System > Storage Health > Allow downloading updates to the Disk Failure Prediction Model. Sets HKLM\Software\Policies\Microsoft\Windows\StorageHealth\AllowDiskHealthModelUpdates (REG_DWORD) to 1 (allow). Allow is also the default, and not configured behaves as enabled, so the entry matters when another tool or policy turned the updates off. Applies to Windows 10 1709 and later and Windows 11.'''
level = "advanced"
category = "reliability"
source = "https://learn.microsoft.com/windows/client-management/mdm/policy-csp-storage#allowdiskhealthmodelupdates"

[[tweak.action]]
registry = { scope = "machine", key = 'Software\Policies\Microsoft\Windows\StorageHealth', name = "AllowDiskHealthModelUpdates", data = { dword = 1 } }
